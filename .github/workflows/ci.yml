name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Pinned to the npm the lockfile is made with. npm on macOS also leaves
      # out the Linux-only transitive deps of optional wasm packages
      # (@emnapi/*), which `npm ci` here then rejects; regenerate the lockfile
      # on Linux (e.g. in a node:24 container) when that happens.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run playground:build
      # Runs `npm pack --dry-run` (which rebuilds via prepack) and fails
      # unless the tarball holds only dist/, package.json, README.md and
      # CHANGELOG.md.
      - run: npm run check-pack
