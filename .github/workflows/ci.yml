name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Newer npm (bundled with current Node 24) rejects this lockfile's
      # optional @emnapi/* entries in `npm ci`, though nothing is wrong with
      # it. 216-mono hit the same thing; pin the npm the lockfile was made with.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run playground:build
      # Runs `npm pack --dry-run` (which rebuilds via prepack) and fails
      # unless the tarball holds only dist/, package.json, README.md and
      # CHANGELOG.md.
      - run: npm run check-pack
